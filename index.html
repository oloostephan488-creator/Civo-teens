<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Gallery</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 80px; }
        h1 { margin-top: 30px; letter-spacing: 2px; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
        .gallery img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 5px; background: #111; }
        .btn { background: #facc15; color: #000; padding: 15px 30px; border-radius: 30px; border: none; font-weight: bold; margin: 20px; }
    </style>
</head>
<body>

    <h1>MODELS PORTFOLIO</h1>
    <p>Tap a photo to view</p>

    <div class="gallery" id="photo-container">
        </div>

    <button class="btn" id="upload-btn">UPLOAD NEW PHOTO</button>

    <script>
        const cloudName = "dsrpadvhd";
        const preset = "a8dkxwtd";
        const container = document.getElementById('photo-container');

        // This list holds your photos. 
        // TIP: To keep them there forever, just copy the URL from the alert and paste it here later.
        const photos = [
            "https://res.cloudinary.com/demo/image/upload/v1312461204/sample.jpg"
        ];

        function showPhotos() {
            container.innerHTML = "";
            photos.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                container.appendChild(img);
            });
        }
        showPhotos();

        var myWidget = cloudinary.createUploadWidget({
            cloudName: cloudName, 
            uploadPreset: preset
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                photos.push(result.info.secure_url);
                showPhotos();
                alert("Upload Success! Copy this URL to save it in your code: " + result.info.secure_url);
            }
        });

        document.getElementById("upload-btn").addEventListener("click", () => myWidget.open());
    </script>
</body>
</html>
