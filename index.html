<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Gallery</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 100px; }
        header { padding: 40px 20px; }
        h1 { font-size: 2rem; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; }
        .gallery img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 4px; background: #111; }
        #upload-btn { background: #222; color: #facc15; border: 1px solid #333; padding: 15px; width: 90%; margin: 40px auto; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>ELITE MODELS</h1>
        <p>NAIROBI</p>
    </header>

    <div class="gallery" id="photo-container">
        </div>

    <button id="upload-btn">UPLOAD NEW PHOTO</button>

    <script>
        const cloudName = "dsrpadvhd";
        const preset = "a8dkxwtd";
        const container = document.getElementById('photo-container');

        // 1. THIS IS THE PERMANENT FIX
        // It fetches all photos from your Cloudinary account automatically
        async function loadPhotos() {
            try {
                // We use your Cloud Name to get the list of images
                const response = await fetch(`https://res.cloudinary.com/${cloudName}/image/list/v1.json`);
                const data = await response.json();
                
                container.innerHTML = ""; // Clear gallery
                data.resources.forEach(img => {
                    const el = document.createElement('img');
                    el.src = `https://res.cloudinary.com/${cloudName}/image/upload/v${img.version}/${img.public_id}.${img.format}`;
                    container.appendChild(el);
                });
            } catch (err) {
                console.log("Upload a photo to start the gallery!");
            }
        }

        // Run this when the page opens
        loadPhotos();

        // 2. THE UPLOAD WIDGET
        var myWidget = cloudinary.createUploadWidget({
            cloudName: cloudName, 
            uploadPreset: preset
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                // Refresh the gallery 2 seconds after upload
                setTimeout(loadPhotos, 2000);
            }
        });

        document.getElementById("upload-btn").addEventListener("click", () => myWidget.open());
    </script>
</body>
</html>
