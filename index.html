<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Gallery</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 100px; }
        header { padding: 40px 20px; }
        h1 { font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase; margin: 0; color: #facc15; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
        .gallery img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; background: #111; }
        #upload-btn { background: #1a1a1a; color: #facc15; border: 1px solid #333; padding: 12px; width: 80%; margin: 30px auto; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>ELITE MODELS</h1>
        <p>NAIROBI</p>
    </header>

    <div class="gallery" id="photo-container">
        </div>

    <button id="upload-btn">UPLOAD NEW PHOTO</button>

    <script>
        const cloudName = "dsrpadvhd";
        const preset = "a8dkxwtd";
        const container = document.getElementById('photo-container');

        async function loadGallery() {
            try {
                // Fetching the full list from your Cloudinary
                const url = `https://res.cloudinary.com/${cloudName}/image/list/v1.json`;
                const response = await fetch(url);
                const data = await response.json();
                
                container.innerHTML = ""; 

                // RECENT FIX: This sorts them so the newest upload is ALWAYS at the top
                data.resources.sort((a, b) => b.version - a.version);

                data.resources.forEach(img => {
                    const el = document.createElement('img');
                    el.src = `https://res.cloudinary.com/${cloudName}/image/upload/v${img.version}/${img.public_id}.${img.format}`;
                    container.appendChild(el);
                });
            } catch (err) {
                console.log("No photos found yet. Use the upload button!");
            }
        }

        loadGallery();

        var myWidget = cloudinary.createUploadWidget({
            cloudName: cloudName, 
            uploadPreset: preset
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                // Refresh the gallery automatically after upload
                setTimeout(loadGallery, 1500);
            }
        });

        document.getElementById("upload-btn").addEventListener("click", () => myWidget.open());
    </script>
</body>
</html>
